<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TextAdventure</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #terminal { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="terminal"></div>
<script>
  // The forest art is a fixed 100 columns wide; a small font size keeps that from
  // wrapping on typical window widths, and the fit addon stretches rows/cols to
  // fill whatever space is actually available (and keeps fitting it on resize).
  const term = new Terminal({ convertEol: true, cursorBlink: true, scrollback: 2000, fontSize: 13 });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById("terminal"));
  fitAddon.fit();
  window.addEventListener("resize", () => fitAddon.fit());

  term.write("Loading TextAdventure...\r\n");

  // Line-buffered keyboard input: xterm.js hands us raw keystrokes, so we collect
  // them ourselves until Enter, then hand the finished line to whichever Java
  // readLine() call is currently waiting on it.
  let inputBuffer = "";
  let pendingResolve = null;

  term.onData(data => {
    for (const ch of data) {
      if (ch === "\r") {
        term.write("\r\n");
        const line = inputBuffer;
        inputBuffer = "";
        if (pendingResolve) {
          const resolve = pendingResolve;
          pendingResolve = null;
          resolve(line);
        }
      } else if (ch === "") {
        if (inputBuffer.length > 0) {
          inputBuffer = inputBuffer.slice(0, -1);
          term.write("\b \b");
        }
      } else {
        inputBuffer += ch;
        term.write(ch);
      }
    }
  });

  // Bridge functions CheerpJ calls from Java's BrowserIO.jsReadLine()/jsWrite().
  // Naming convention: Java_<fully.qualified.Class>_<method>, dots replaced with underscores.
  async function Java_IsaVII_web_BrowserIO_jsReadLine(lib) {
    return await new Promise(resolve => { pendingResolve = resolve; });
  }

  async function Java_IsaVII_web_BrowserIO_jsWrite(lib, text) {
    term.write(text + "\r\n");
  }

  async function main() {
    await cheerpjInit({
      version: 17,
      natives: {
        Java_IsaVII_web_BrowserIO_jsReadLine,
        Java_IsaVII_web_BrowserIO_jsWrite,
      },
    });
    term.write("Starting game...\r\n");

    // /app/ maps to the site's domain root, not the folder index.html lives in -
    // on a GitHub Pages project site (e.g. https://user.github.io/Repo/) that's a
    // subpath, so the jar's classpath entry has to include that subpath too.
    const pageDir = window.location.pathname.replace(/[^/]*$/, "");
    const jarPath = "/app" + pageDir + "TextAdventure.jar";

    const exitCode = await cheerpjRunMain("IsaVII.web.BrowserMain", jarPath);
    term.write("\r\n[Game exited with code " + exitCode + "]\r\n");
  }

  main();
</script>
</body>
</html>
